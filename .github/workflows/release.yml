name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run_commit:
        description: 'Upstream commit SHA to build (dry run — no publish)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # Nightly tags (`v...-ci....`) are created by the daily workflow. They are
    # not release tags and must not start the release pipeline.
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-ci.')
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.compute.outputs.package_version }}
      base_version: ${{ steps.compute.outputs.base_version }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
      upstream_version: ${{ steps.verify.outputs.upstream_version }}
      is_dry_run: ${{ steps.compute.outputs.is_dry_run }}
      is_prerelease: ${{ steps.compute.outputs.is_prerelease }}
      is_respin: ${{ steps.compute.outputs.is_respin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and dry-run flag
        id: compute
        env:
          # Passed through the environment rather than interpolated into the
          # script. A git ref may legally contain a backtick, so
          # `TAG="${{ github.ref_name }}"` is a command-substitution site that
          # runs BEFORE Guard 1 has looked at the tag at all.
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            # Disposable version so `dotnet pack` succeeds; never published.
            echo "package_version=0.0.0-dryrun.${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "base_version=dryrun" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "is_respin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard 1 - tag shape. Permits:
          #   v1.2.3        stable
          #   v1.2.3.4      packaging respin
          #   v1.2.3-rc.1   release candidate
          #
          # The optional groups are mutually exclusive: `v1.2.3.4-rc.1` is not
          # a valid shape. Numeric components are canonical, so the version the
          # guard names is the version NuGet will store.
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(1|[1-9][0-9]*)|-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Tag $TAG does not match canonical v<X.Y.Z>, v<X.Y.Z.N>, or v<X.Y.Z-rc.N>"
            exit 1
          fi
          VERSION="${TAG#v}"
          PRERELEASE=false
          IS_RESPIN=false
          BASE=""
          if [[ "$VERSION" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\.(1|[1-9][0-9]*)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            IS_RESPIN=true
          elif [[ "$VERSION" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-rc\.(0|[1-9][0-9]*)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            PRERELEASE=true
          else
            BASE="$VERSION"
          fi
          VERSION_FILE=$(bash build/read-package-version.sh)
          if [ "$IS_RESPIN" = "true" ]; then
            # A respin targets the latest published stable. It is allowed while
            # version.json already points at the next release; Guard 3 verifies
            # that this base is that latest stable.
            if ! awk -v a="$BASE" -v b="$VERSION_FILE" 'BEGIN {
              split(a, x, "."); split(b, y, ".");
              for (i = 1; i <= 3; i++) {
                if (x[i] + 0 < y[i] + 0) exit 0;
                if (x[i] + 0 > y[i] + 0) exit 1;
              }
              exit 0;
            }'; then
              echo "::error::Respin base $BASE is ahead of version.json $VERSION_FILE"
              exit 1
            fi
          elif [ "$BASE" != "$VERSION_FILE" ]; then
            echo "::error::Tag base $BASE does not match version.json $VERSION_FILE"
            exit 1
          fi
          echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "is_respin=$IS_RESPIN" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
          echo "Base version: $BASE"
          echo "Respin: $IS_RESPIN"

      - name: Resolve upstream pin
        id: pin
        env:
          IS_DRY_RUN: ${{ steps.compute.outputs.is_dry_run }}
          DRY_RUN_COMMIT: ${{ inputs.dry_run_commit }}
        run: |
          if [ "$IS_DRY_RUN" = "true" ]; then
            COMMIT="$DRY_RUN_COMMIT"
          else
            COMMIT=$(jq -er '.commit | select(type == "string")' ghostty-upstream.json 2>/dev/null) || {
              echo "::error::Could not read a string commit from ghostty-upstream.json"
              exit 1
            }
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a full 40-hex upstream commit: '$COMMIT'"
            exit 1
          fi
          echo "upstream_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $COMMIT"

      - name: Guard 2 - record the upstream version
        id: verify
        if: steps.compute.outputs.is_dry_run == 'false'
        env:
          COMMIT: ${{ steps.pin.outputs.upstream_commit }}
        run: |
          UPSTREAM=$(curl -sSfL "https://raw.githubusercontent.com/ghostty-org/ghostty/${COMMIT}/build.zig.zon" \
            | bash build/read-upstream-version.sh)
          # The package version is independent of the upstream version. This
          # value is recorded for release notes and the GitHub release body.
          printf 'upstream_version=%s\n' "$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $UPSTREAM"

      - name: Guard 3 - published version ordering
        if: steps.compute.outputs.is_dry_run == 'false'
        env:
          PKG_VERSION: ${{ steps.compute.outputs.package_version }}
          BASE_VERSION: ${{ steps.compute.outputs.base_version }}
        run: |
          python3 build/check-nuget-version.py release \
            --version "$PKG_VERSION" \
            --base "$BASE_VERSION"

      - name: Guard 4 - pinned SHA exists upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.pin.outputs.upstream_commit }}
        run: |
          # `git ls-remote` only lists ref tips, so an intermediate commit
          # will not appear; fall back to the GitHub API which resolves any
          # reachable commit by SHA. Authenticated call uses the workflow's
          # GITHUB_TOKEN to avoid the 60 req/hour unauthenticated limit that
          # applies per shared runner IP.
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/ghostty-org/ghostty/commits/$COMMIT")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Pinned commit $COMMIT not found upstream (HTTP $HTTP)"
            exit 1
          fi

      - name: Guard 5 - tag is on main
        if: steps.compute.outputs.is_dry_run == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on origin/main"
            exit 1
          fi

      - name: Dry run — record upstream version (informational)
        if: steps.compute.outputs.is_dry_run == 'true'
        env:
          COMMIT: ${{ steps.pin.outputs.upstream_commit }}
        run: |
          UPSTREAM=$(curl -sSfL "https://raw.githubusercontent.com/ghostty-org/ghostty/${COMMIT}/build.zig.zon" \
            | bash build/read-upstream-version.sh || echo "unknown")
          echo "::notice::Dry run against upstream version $UPSTREAM (commit $COMMIT)"

  build-native:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zig_target: x86_64-windows
            rid: win-x64
            artifact: ghostty-vt.dll
            src_dir: bin
          - os: ubuntu-latest
            zig_target: x86_64-linux-gnu.2.31
            rid: linux-x64
            artifact: libghostty-vt.so
            src_dir: lib
          - os: macos-latest
            zig_target: aarch64-macos
            rid: osx-arm64
            artifact: libghostty-vt.dylib
            src_dir: lib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Derived from the pinned commit being released, so the toolchain
      # tracks the pin automatically as the daily sync moves it (issue #43).
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          ghostty-ref: ${{ needs.preflight.outputs.upstream_commit }}

      - name: Clone Ghostty at pinned commit
        env:
          UPSTREAM_COMMIT: ${{ needs.preflight.outputs.upstream_commit }}
        run: |
          git init ghostty-src
          cd ghostty-src
          git remote add origin https://github.com/ghostty-org/ghostty.git
          git fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout FETCH_HEAD

      - name: Build native libghostty-vt
        # `-Demit-xcframework=false`: on a macOS host Ghostty otherwise builds
        # a libghostty-vt XCFramework (macOS universal + iOS device/simulator)
        # alongside the dylib. We ship none of those slices, and Zig 0.17.0
        # cannot compile the iOS ones (see the same flag in daily-upstream.yml).
        run: |
          cd ghostty-src
          zig build install -Demit-lib-vt=true -Demit-xcframework=false -Dtarget="${{ matrix.zig_target }}" -Doptimize=ReleaseSafe
          mkdir -p "${{ github.workspace }}/runtimes/${{ matrix.rid }}/native"
          cp "zig-out/${{ matrix.src_dir }}/${{ matrix.artifact }}" \
            "${{ github.workspace }}/runtimes/${{ matrix.rid }}/native/"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/${{ matrix.artifact }}

  pack:
    needs: [preflight, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download native (win-x64)
        uses: actions/download-artifact@v8
        with:
          name: native-win-x64
          path: runtimes/win-x64/native

      - name: Download native (linux-x64)
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native

      - name: Download native (osx-arm64)
        uses: actions/download-artifact@v8
        with:
          name: native-osx-arm64
          path: runtimes/osx-arm64/native

      - name: Build
        run: dotnet build Ghostty.Vt.sln --configuration Release

      # P/Invoke probes the assembly directory first; dotnet test looks for
      # libghostty-vt.so (lib-prefixed on Linux) next to the test binaries.
      - name: Stage native library for tests
        run: |
          LIB=$(find runtimes -name 'libghostty-vt.so' -print -quit)
          if [ -z "$LIB" ]; then
            echo "libghostty-vt.so not found under runtimes/" >&2
            find runtimes -type f >&2
            exit 1
          fi
          cp "$LIB" tests/Ghostty.Vt.Tests/bin/Release/net9.0/libghostty-vt.so

      - name: Test
        run: dotnet test Ghostty.Vt.sln --no-build --configuration Release

      - name: Pack
        env:
          PKG_VERSION: ${{ needs.preflight.outputs.package_version }}
        run: |
          dotnet pack src/Ghostty.Vt/Ghostty.Vt.csproj \
            --configuration Release \
            --output artifacts \
            -p:Version="$PKG_VERSION"

      - name: Assert packed version
        env:
          PKG_VERSION: ${{ needs.preflight.outputs.package_version }}
        run: |
          bash build/assert-packed-version.sh \
            "$(find artifacts -name '*.nupkg' -print -quit)" \
            "$PKG_VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/

  validate-pack:
    needs: [preflight, pack]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download packed nupkg
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts

      - name: Validate pack (real NuGet consumer)
        run: |
          dotnet test tests/Ghostty.Vt.PackageConsumer.Tests/Ghostty.Vt.PackageConsumer.Tests.csproj \
            --configuration Release \
            --logger "trx"

  publish:
    needs: [preflight, validate-pack]
    if: needs.preflight.outputs.is_dry_run == 'false'
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts

      - name: Verify version is unpublished
        env:
          PKG_VERSION: ${{ needs.preflight.outputs.package_version }}
        run: |
          URL="https://api.nuget.org/v3-flatcontainer/deblasis.ghosttyvt/${PKG_VERSION}/deblasis.ghosttyvt.${PKG_VERSION}.nupkg"
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          if [ "$HTTP" = "200" ]; then
            echo "::error::Version ${PKG_VERSION} is already published; refusing to create a second release."
            exit 1
          fi
          if [ "$HTTP" != "404" ]; then
            echo "::error::Could not confirm ${PKG_VERSION} is unpublished (HTTP $HTTP)."
            exit 1
          fi

      - name: Publish to NuGet
        # dotnet nuget push automatically pushes the matching *.snupkg symbols
        # package from the same folder. --skip-duplicate is a race guard; the
        # explicit check above refuses an already-published version first.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ needs.preflight.outputs.package_version }}
          UPSTREAM_COMMIT: ${{ needs.preflight.outputs.upstream_commit }}
          UPSTREAM_VERSION: ${{ needs.preflight.outputs.upstream_version }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            HEADLINE="Prerelease of DeBlasis.GhosttyVt ${PKG_VERSION}, built against Ghostty ${UPSTREAM_VERSION} at ghostty-org/ghostty@${UPSTREAM_COMMIT}."
            CAVEAT="Package versions use independent SemVer; upstream tracking is recorded above. Install with --prerelease."
            PRERELEASE_FLAG=(--prerelease)
            LATEST_FLAG=(--latest=false)
          else
            HEADLINE="Stable release of DeBlasis.GhosttyVt ${PKG_VERSION}, built against Ghostty ${UPSTREAM_VERSION} at ghostty-org/ghostty@${UPSTREAM_COMMIT}."
            CAVEAT="Package versions use independent SemVer; upstream tracking is recorded above."
            PRERELEASE_FLAG=()
            LATEST_FLAG=(--latest)
          fi
          NOTES=$(printf '%s\n' \
            "$HEADLINE" \
            "" \
            "$CAVEAT" \
            "" \
            "📦 https://www.nuget.org/packages/DeBlasis.GhosttyVt/${PKG_VERSION}" \
            "" \
            "---")
          gh release create "v${PKG_VERSION}" \
            --title "v${PKG_VERSION}" \
            "${PRERELEASE_FLAG[@]}" \
            "${LATEST_FLAG[@]}" \
            --generate-notes \
            --notes "$NOTES"

      - name: Upload package assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ needs.preflight.outputs.package_version }}
        run: |
          # Use nullglob so a missing .snupkg doesn't pass the literal glob to gh.
          shopt -s nullglob
          ASSETS=(artifacts/*.nupkg artifacts/*.snupkg)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No package assets found in artifacts/"
            exit 1
          fi
          gh release upload "v${PKG_VERSION}" "${ASSETS[@]}"
