name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the *pinned* commit, not `main`. NativeMethods.cs is
      # hand-maintained against the SHA in ghostty-upstream.json, so building
      # main here tested a pairing this repo never ships: with the pin 57 days
      # behind (issue #43), 20 of 197 tests failed with
      # EntryPointNotFoundException for symbols upstream had since renamed.
      #
      # Detecting that drift is the daily sync's job, not per-PR CI's: the
      # sync resolves upstream HEAD, builds it, tests against it, and (since
      # #46) regenerates the bindings against it every night.
      #
      # On `pull_request` — including from a fork — ghostty-upstream.json is
      # attacker-controlled, and a `${{ }}` expression is substituted
      # textually before bash parses the line. So validate here, once, before
      # the value can reach an interpolation or a step output: `=~` matches
      # the whole string, which also rejects an embedded newline (that would
      # otherwise let the file inject arbitrary step outputs via $GITHUB_OUTPUT).
      # release.yml has an equivalent check in its "Guard 3"; ci.yml had none.
      - name: Resolve and validate pinned upstream commit
        id: pin
        run: |
          COMMIT=$(jq -r '.commit' ghostty-upstream.json)
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ghostty-upstream.json .commit is not a 40-character SHA"
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # Toolchain derived from that commit's build.zig.zon rather than
      # hardcoded, so an upstream Zig bump cannot silently break CI (#43).
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          ghostty-ref: ${{ steps.pin.outputs.commit }}

      - name: Clone Ghostty at pinned commit
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          git init /tmp/ghostty
          cd /tmp/ghostty
          git remote add origin https://github.com/ghostty-org/ghostty.git
          git fetch --depth 1 origin "$COMMIT"
          git checkout FETCH_HEAD

      - name: Build native libghostty-vt
        run: |
          cd /tmp/ghostty
          zig build install -Demit-lib-vt=true -Dtarget=x86_64-linux-gnu.2.31 -Doptimize=ReleaseSafe
          mkdir -p ${{ github.workspace }}/runtimes/linux-x64/native
          cp zig-out/lib/libghostty-vt.so ${{ github.workspace }}/runtimes/linux-x64/native/

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: libghostty-vt-linux-x64
          path: runtimes/linux-x64/native/libghostty-vt.so

  # The strict half of the drift detection added in #46.
  #
  # daily-upstream regenerates against the NEW upstream commit and reports a
  # difference, because a difference there is expected news. This job
  # regenerates against the commit this repo is actually pinned to, where the
  # committed NativeMethods.cs is supposed to already match — so any
  # difference is a real defect and fails the build. That is the "no drift"
  # baseline, and it is also what keeps the generator itself honest: if
  # ClangSharp stops working again the way it had silently stopped working
  # for months (#46), this job goes red on the very next PR instead of
  # reporting a cheerful green nothing.
  bindings-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same validation as build-native above, for the same reason: on a fork
      # `pull_request` this file is attacker-controlled.
      - name: Resolve and validate pinned upstream commit
        id: pin
        run: |
          COMMIT=$(jq -r '.commit' ghostty-upstream.json)
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ghostty-upstream.json .commit is not a 40-character SHA"
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # The rsp resolves headers relative to the working directory, so the
      # source has to land in ./ghostty-src rather than /tmp.
      - name: Clone Ghostty at pinned commit
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          git init ghostty-src
          cd ghostty-src
          git remote add origin https://github.com/ghostty-org/ghostty.git
          git fetch --depth 1 origin "$COMMIT"
          git checkout FETCH_HEAD

      - name: Setup ClangSharp
        id: clangsharp
        uses: ./.github/actions/setup-clangsharp

      - name: Regenerate bindings from the pinned headers
        run: ${{ steps.clangsharp.outputs.generator }} @build/generate-bindings.rsp @${{ steps.clangsharp.outputs.extra-args-file }}

      - name: Fail on drift from the committed bindings
        id: drift
        run: |
          if git diff --quiet src/Ghostty.Vt/Native/NativeMethods.cs; then
            echo "::notice title=Bindings::No drift — regenerated bindings match the committed NativeMethods.cs."
            exit 0
          fi
          echo "::error title=Binding drift::src/Ghostty.Vt/Native/NativeMethods.cs does not match what the generator produces from the pinned ghostty headers. Regenerate it with build/generate-bindings.rsp and commit the result, or update the pin and the bindings together."
          git --no-pager diff --stat src/Ghostty.Vt/Native/NativeMethods.cs
          git --no-pager diff -- src/Ghostty.Vt/Native/NativeMethods.cs | head -200
          exit 1

      # Only when the drift step itself failed — otherwise an earlier failure
      # (a broken generator, say) would upload the untouched committed file
      # under a name that claims it was regenerated.
      - name: Upload regenerated bindings
        if: failure() && steps.drift.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-bindings-pinned
          path: src/Ghostty.Vt/Native/NativeMethods.cs

  build-test:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: libghostty-vt-linux-x64
          path: runtimes/linux-x64/native

      - name: Restore
        run: dotnet restore Ghostty.Vt.sln

      - name: Build
        run: dotnet build Ghostty.Vt.sln --no-restore --configuration Release

      - name: Copy native library for tests
        run: cp runtimes/linux-x64/native/libghostty-vt.so tests/Ghostty.Vt.Tests/bin/Release/net9.0/ghostty-vt.so

      - name: Test
        run: dotnet test Ghostty.Vt.sln --no-build --configuration Release --logger "trx"

  # Single-platform (linux-x64) on push-time CI — fast-feedback path.
  # release.yml runs the full windows/linux/macos matrix as the gate
  # before nuget.org publish; per-push is the common-case smoke test.
  validate-pack:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: libghostty-vt-linux-x64
          path: runtimes/linux-x64/native

      - name: Pack
        run: |
          dotnet pack src/Ghostty.Vt/Ghostty.Vt.csproj \
            --configuration Release \
            --output artifacts \
            -p:Version=0.0.1-ci.${{ github.run_id }}

      - name: Validate pack (real NuGet consumer)
        run: |
          dotnet test tests/Ghostty.Vt.PackageConsumer.Tests/Ghostty.Vt.PackageConsumer.Tests.csproj \
            --configuration Release \
            --logger "trx"
