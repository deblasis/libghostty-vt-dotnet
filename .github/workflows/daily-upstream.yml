name: Daily Upstream Sync

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test and pack only — do not publish, move the pin, or cut a release'
        type: boolean
        # Safe by default, and free: a `schedule` event does not apply
        # workflow_dispatch input defaults (the `inputs` context is empty), so
        # this does not touch the nightly publish path. It only means a
        # maintainer who clicks "Run workflow" to retry a failed nightly and
        # leaves the box alone cannot accidentally publish to nuget.org, push
        # a moved pin to main, and cut a release. Untick it to publish.
        default: true

# A manual run racing the 03:30 cron would give two `publish` jobs both doing
# `git push` of ghostty-upstream.json with no `pull --rebase` between them.
concurrency:
  group: daily-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      new_commit: ${{ steps.check.outputs.commit }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for upstream changes
        id: check
        run: |
          CURRENT=$(jq -r '.commit' ghostty-upstream.json)
          LATEST=$(git ls-remote https://github.com/ghostty-org/ghostty.git HEAD | awk '{print $1}')

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$LATEST" >> "$GITHUB_OUTPUT"

          # Fetch build.zig.zon directly to read the upstream version (Zig ZON syntax: .version = "x.y.z")
          VERSION=$(curl -sSfL "https://raw.githubusercontent.com/ghostty-org/ghostty/${LATEST}/build.zig.zon" \
            | grep -oP '(?<=\.version = ")[^"]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "New upstream: $LATEST (version $VERSION)"

  prepare-ghostty-src:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone Ghostty at new commit
        run: |
          git init ghostty-src
          cd ghostty-src
          git remote add origin https://github.com/ghostty-org/ghostty.git
          git fetch --depth 1 origin ${{ needs.check-upstream.outputs.new_commit }}
          git checkout FETCH_HEAD

      # Windows runners cannot create symlinks during extraction without
      # Developer Mode or SeCreateSymbolicLinkPrivilege, so a tar that carries
      # one aborts the whole Windows build ("tar: ./CLAUDE.md: Cannot create
      # symlink to 'AGENTS.md'"). Upstream today ships exactly one symlink
      # (CLAUDE.md -> AGENTS.md) and none of them are load-bearing for the
      # build, so flatten them here — once, on Linux — rather than teaching
      # each consumer a different extraction incantation.
      - name: Flatten symlinks (Windows runners cannot extract them)
        run: |
          find ghostty-src -type l -print0 | while IFS= read -r -d '' link; do
            if [ -f "$link" ]; then
              target=$(readlink -f "$link")
              rm "$link" && cp "$target" "$link"
              echo "flattened file symlink: ${link#ghostty-src/}"
            elif [ -d "$link" ]; then
              target=$(readlink -f "$link")
              rm "$link" && cp -R "$target" "$link"
              echo "flattened directory symlink: ${link#ghostty-src/}"
            else
              rm "$link"
              echo "::warning title=Dangling symlink::dropped ${link#ghostty-src/} (target does not exist upstream)"
            fi
          done

      - name: Tar source (preserves permissions; symlinks already flattened)
        run: tar -cf ghostty-src.tar -C ghostty-src .

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-src
          path: ghostty-src.tar
          retention-days: 1
          compression-level: 0  # already a tar; skip redundant zip compression

  build-native:
    needs: [check-upstream, prepare-ghostty-src]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zig emits Windows DLLs to zig-out/bin (zig-out/lib holds the .lib import library);
          # Unix shared libs land in zig-out/lib.
          - os: windows-latest
            target: x86_64-windows
            zig_target: x86_64-windows
            rid: win-x64
            artifact: ghostty-vt.dll
            src_dir: bin
          - os: ubuntu-latest
            target: x86_64-linux
            zig_target: x86_64-linux-gnu.2.31
            rid: linux-x64
            artifact: libghostty-vt.so
            src_dir: lib
          - os: macos-latest
            target: aarch64-macos
            zig_target: aarch64-macos
            rid: osx-arm64
            artifact: libghostty-vt.dylib
            src_dir: lib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Version comes from the upstream commit's own build.zig.zon, so an
      # upstream Zig bump no longer silently breaks every sync (issue #43).
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          ghostty-ref: ${{ needs.check-upstream.outputs.new_commit }}

      - name: Download Ghostty source
        uses: actions/download-artifact@v8
        with:
          name: ghostty-src

      - name: Extract Ghostty source
        run: |
          mkdir -p /tmp/ghostty
          tar -xf ghostty-src.tar -C /tmp/ghostty

      - name: Build native libghostty-vt
        # We only need the shared library for the requested target. On a macOS
        # host Ghostty's `install` step additionally builds a universal
        # libghostty-vt XCFramework (macOS x86_64 + arm64, plus iOS device and
        # simulator slices) whenever xcodebuild is present, which it is on the
        # GitHub runner. Zig 0.17.0 cannot compile those iOS slices at all:
        # std/Io/Threaded.zig references `null_file.fd`, a field the iOS
        # NullFile does not have, so the entire macOS leg dies building an
        # artifact this project never ships. Skip it explicitly.
        run: |
          cd /tmp/ghostty
          zig build install -Demit-lib-vt=true -Demit-xcframework=false -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe
          mkdir -p "${{ github.workspace }}/runtimes/${{ matrix.rid }}/native"
          cp "zig-out/${{ matrix.src_dir }}/${{ matrix.artifact }}" \
            "${{ github.workspace }}/runtimes/${{ matrix.rid }}/native/"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/${{ matrix.artifact }}

  regenerate-bindings:
    # No longer waits on build-native: this job reads headers, never the
    # compiled library, so the dependency only slowed the signal down.
    # `check-upstream` is here only so the artifact can record which upstream
    # commit it was generated for; the commit binding is asserted before use.
    needs: [check-upstream, prepare-ghostty-src]
    runs-on: ubuntu-latest
    # A hang here would hold `publish` (which lists this job in `needs`) until
    # the default 6-hour timeout. Fifteen times the observed runtime is ample.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write   # durable API-delta tracker (the red bindings gate is gone)
    env:
      # A manual dry run must not mutate the public issue tracker.
      DRY_RUN: ${{ inputs.dry_run == true }}
    # Drift detector: regenerates the P/Invoke surface from the NEW upstream
    # headers. `ci.yml` holds the strict counterpart — regenerate against the
    # *pinned* commit and fail on any difference. When this succeeds, publish
    # consumes the artifact and refreshes the pinned reference with the pin.
    #
    # `continue-on-error: true` used to sit here and hid a generator that had
    # never once started (#46): every run reported success while producing
    # nothing. Two outcomes were being conflated, so they are now separated —
    #   * the generator failing to run is a BUG and fails this job;
    #   * the regenerated bindings differing from the committed ones is a
    #     FINDING and is reported, not failed.
    # `publish` lists this job in `needs` now, but its explicit
    # `!cancelled()` + result guard means a failed detector does not skip
    # publishing. When the generator succeeds, `publish` consumes the artifact
    # below and refreshes the pinned reference in the same commit as the pin.
    #
    # Runs on Linux so libclang resolves C system headers (<stddef.h>,
    # <stdint.h>, ...) from glibc without pulling in the MSVC/Windows SDK.
    # The rsp file passes --target=x86_64-pc-linux-gnu to match.
    steps:
      - uses: actions/checkout@v4

      - name: Download Ghostty source
        uses: actions/download-artifact@v8
        with:
          name: ghostty-src

      - name: Extract Ghostty source
        run: |
          mkdir -p ghostty-src
          tar -xf ghostty-src.tar -C ghostty-src

      - name: Setup ClangSharp
        id: clangsharp
        uses: ./.github/actions/setup-clangsharp

      # Hard failure: the generator must run and emit a real P/Invoke surface.
      # Its exit code alone proves nothing — it exits 0 while emitting nothing.
      - name: Regenerate bindings
        run: bash build/generate-bindings.sh "${{ steps.clangsharp.outputs.generator }}" "${{ steps.clangsharp.outputs.extra-args-file }}"

      # Reported, not failed: entry points disappearing at a *new* upstream
      # commit is the news this job exists to deliver, not a defect in the
      # repo. ci.yml runs the same check against the pinned commit, where a
      # missing symbol really is a defect and does fail.
      #
      # Branching on the exit code matters. Treating "any non-zero" as drift
      # would report a *broken checker* as news — a cheerful "binding drift"
      # warning above an empty list of entry points — which is precisely the
      # conflation between "detector says no" and "detector cannot speak" that
      # #46 was made of. The script distinguishes them: 1 = drift, 2 = the
      # question was never asked.
      - name: Report entry points removed upstream
        run: |
          git show HEAD:src/Ghostty.Vt/Native/NativeMethods.cs > "$RUNNER_TEMP/committed-bindings.cs"
          set +e
          bash build/check-binding-symbols.sh "$RUNNER_TEMP/committed-bindings.cs" ghostty-src/include/ghostty
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "::notice title=Bindings::Every declared entry point still exists at the new upstream commit."
              ;;
            1)
              echo "::warning title=Binding drift::Entry points listed above no longer exist upstream. The bindings must be updated before this commit can be adopted; the 'regenerated-bindings' artifact holds the generator's view of the new API."
              ;;
            *)
              echo "::error::check-binding-symbols.sh could not run (exit $rc). This is a broken check, not a clean result."
              exit 1
              ;;
          esac

      # Informational: what the upstream API change actually looks like, as a
      # diff against the same reference ci.yml gates the pinned output on.
      # This is the closest thing to a ready-made summary of the work a delta
      # PR has to absorb, including signature changes that the entry-point
      # check above cannot see.
      - name: Summarise API change against the pinned reference
        run: |
          if diff -u build/bindings-reference/NativeMethods.pinned.cs                     src/Ghostty.Vt/Native/NativeMethods.cs > "$RUNNER_TEMP/upstream.diff"; then
            echo "::notice title=API::The new upstream commit generates bindings identical to the pinned reference."
          else
            added=$(grep -c '^+' "$RUNNER_TEMP/upstream.diff" || true)
            removed=$(grep -c '^-' "$RUNNER_TEMP/upstream.diff" || true)
            echo "::warning title=API::Upstream generates different bindings than the pinned reference (+${added}/-${removed} diff lines). See the log and the 'regenerated-bindings' artifact."
            # Signature-level changes first, and unabridged. These are the
            # highest-signal subset and are what the entry-point check cannot
            # see: ghostty_terminal_new losing its by-value options struct is
            # one line here and invisible everywhere else. Printing only the
            # truncated head of the full diff would have buried it -- in the
            # first run of this step it fell past the 20000-character cut.
            echo "--- changed declarations (signature level) ---"
            grep -E '^[+-].*static extern' "$RUNNER_TEMP/upstream.diff" || true
            echo "--- full diff (truncated) ---"
            head -c 20000 "$RUNNER_TEMP/upstream.diff"
          fi

      # The nightly now advances the pinned reference automatically, so the red
      # `ci.yml` signature-change alarm is gone. Replace it with a durable,
      # non-red tracker: one open issue per condition, with the signature-level
      # lines and the run link. Best-effort: an issue-tracker outage must not
      # hold the pin (the step cannot fail the job, and dry runs print the body
      # instead of posting it).
      - name: Track API delta in an issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.check-upstream.outputs.new_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Upstream bindings API delta
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/upstream.diff" ]; then
            echo "No API delta; nothing to track."
            exit 0
          fi

          SIGNATURES=$(grep -E '^[+-].*static extern' "$RUNNER_TEMP/upstream.diff" | head -50 || true)
          BODY=$(printf 'Upstream `%s` generates a different pinned binding reference — [run](%s).\n\nThe pinned reference is refreshed automatically with the pin. The hand-maintained `src/Ghostty.Vt/Native/NativeMethods.cs` still needs a human to adopt the new surface.\n\nSignature-level changes:\n\n```diff\n%s\n```\n' \
            "$COMMIT" "$RUN_URL" "$SIGNATURES")

          # Dry runs exercise the body construction but must not mutate the
          # public tracker.
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "Dry run: would file or update '$TITLE' with:"
            printf '%s\n' "$BODY"
            exit 0
          fi

          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Stage into a directory so the artifact can carry a metadata file that
      # binds it to the upstream commit. The publish job asserts that binding
      # before the pin can move; a re-run that resolves a different HEAD fails
      # closed instead of committing a reference from the wrong commit.
      - name: Stage regenerated binding artifact
        run: |
          mkdir -p "$RUNNER_TEMP/regenerated-bindings"
          cp src/Ghostty.Vt/Native/NativeMethods.cs "$RUNNER_TEMP/regenerated-bindings/NativeMethods.cs"
          printf 'upstream_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "${{ needs.check-upstream.outputs.new_commit }}" \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}" \
            > "$RUNNER_TEMP/regenerated-bindings/metadata.txt"

      - name: Upload bindings
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-bindings
          path: ${{ runner.temp }}/regenerated-bindings
          if-no-files-found: error

  publish:
    # `regenerate-bindings` feeds the pinned binding reference now, so the pin
    # move and the reference refresh land in one commit and keep `ci.yml`'s
    # byte-identical gate green. A failed detector must still not stop the
    # package from publishing (#46), so the job-level `if` runs on
    # `!cancelled()` plus explicit check-upstream/build-native result checks.
    #
    # The pin move itself is held when the reference is unavailable. Moving the
    # pin alone would leave main pointing at a stale reference and, because the
    # next night sees `changed=false`, there would be no automatic retry. The
    # package can still publish; the pin waits for a generator that works.
    needs: [check-upstream, build-native, regenerate-bindings]
    if: |
      !cancelled() &&
      needs.check-upstream.result == 'success' &&
      needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit updated ghostty-upstream.json + create release
      # No `issues: write` — failure reporting moved to the notify-failure
      # job, which is the only one that also fires when build-native fails.
    env:
      # Secret gate: the publish / commit-update / release steps are skipped
      # when NUGET_API_KEY is absent. Earlier steps (build, test, pack) still
      # run so the daily workflow remains useful as a validation pipeline
      # while the final publishing destination is still being decided.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      # A manual `workflow_dispatch` with dry_run=true exercises the whole
      # pipeline (build / test / pack) without publishing, moving the pin, or
      # cutting a release — the only safe way to validate a workflow change on
      # a repo where NUGET_API_KEY is set. Empty (falsy) on scheduled runs.
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download native (win-x64)
        uses: actions/download-artifact@v8
        with:
          name: native-win-x64
          path: runtimes/win-x64/native

      - name: Download native (linux-x64)
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native

      - name: Download native (osx-arm64)
        uses: actions/download-artifact@v8
        with:
          name: native-osx-arm64
          path: runtimes/osx-arm64/native

      # The generator output is what `ci.yml` compares the pinned reference
      # against. Download it when the generator succeeded; the commit step
      # below writes it to build/bindings-reference/NativeMethods.pinned.cs in
      # the same commit as the pin move, so the next `ci.yml` run sees a
      # consistent tree. This is NOT the hand-maintained NativeMethods.cs:
      # that file stays untouched and still needs a human to adopt new API
      # surface (ClangSharp emits DllImport while the committed file uses
      # LibraryImport).
      #
      # If the generator failed, this download is skipped and a later step
      # holds the pin; the package still publishes. If the generator reports
      # success but its artifact is missing or wrong, the validation step
      # below fails closed before Build/NuGet: a successful job result is the
      # claim that the reference is trustworthy, and a missing file is an
      # infrastructure failure, not a reason to commit a stale reference.
      - name: Download regenerated binding reference
        if: needs.regenerate-bindings.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: regenerated-bindings
          path: ${{ runner.temp }}/regenerated-bindings

      - name: Validate regenerated binding reference
        if: needs.regenerate-bindings.result == 'success'
        run: |
          bash build/validate-regenerated-reference.sh \
            "${{ runner.temp }}/regenerated-bindings" \
            "${{ needs.check-upstream.outputs.new_commit }}"

      # Stage the new reference and derive the raw layer before anything is
      # built or packed. The package must ship the raw signatures that match
      # the native library it is built against, not the previous pin's.
      - name: Stage regenerated reference and raw ABI layer
        if: needs.regenerate-bindings.result == 'success'
        run: |
          bash build/validate-regenerated-reference.sh \
            "${{ runner.temp }}/regenerated-bindings" \
            "${{ needs.check-upstream.outputs.new_commit }}" \
            --stage
          python3 build/emit-compiled-native.py \
            build/bindings-reference/NativeMethods.pinned.cs \
            src/Ghostty.Vt/Raw/GhosttyVtNative.g.cs
          python3 build/check-native-coverage.py
          git diff --stat -- \
            build/bindings-reference/NativeMethods.pinned.cs \
            src/Ghostty.Vt/Raw/GhosttyVtNative.g.cs
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "::notice title=Reference refresh::Would update the pinned reference and raw ABI layer; no commit in dry run."
          fi

      - name: Build
        run: dotnet build Ghostty.Vt.sln --configuration Release

      # P/Invoke probes the assembly directory first; `dotnet test` looks for
      # libghostty-vt.so (lib-prefixed on Linux) next to the test binaries.
      - name: Stage native library for tests
        run: |
          LIB=$(find runtimes -name 'libghostty-vt.so' -print -quit)
          if [ -z "$LIB" ]; then
            echo "libghostty-vt.so not found under runtimes/" >&2
            find runtimes -type f >&2
            exit 1
          fi
          cp "$LIB" tests/Ghostty.Vt.Tests/bin/Release/net9.0/libghostty-vt.so

      - name: Test
        run: dotnet test Ghostty.Vt.sln --no-build --configuration Release

      - name: Compute version
        id: version
        run: |
          VERSION_BASE="${{ needs.check-upstream.outputs.new_version }}"
          COMMIT="${{ needs.check-upstream.outputs.new_commit }}"
          SHORT="${COMMIT:0:8}"
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          VERSION_BASE="${VERSION_BASE%-dev}"
          PACKAGE_VERSION="${VERSION_BASE}-ci.${TIMESTAMP}.${SHORT}"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $PACKAGE_VERSION"

      - name: Pack
        run: |
          dotnet pack src/Ghostty.Vt/Ghostty.Vt.csproj \
            --configuration Release \
            --output artifacts \
            -p:Version=${{ steps.version.outputs.package_version }}

      - name: Publish to NuGet
        # dotnet nuget push automatically pushes the matching *.snupkg symbols
        # package from the same folder. --skip-duplicate makes retries safe.
        if: env.NUGET_API_KEY != '' && env.DRY_RUN != 'true'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Skipped publish (no NUGET_API_KEY)
        if: env.NUGET_API_KEY == ''
        run: |
          echo "::notice title=Publish skipped::NUGET_API_KEY is not set on this repo."
          echo "The daily workflow built + tested + packed successfully, but publishing is"
          echo "skipped until a destination is chosen and the corresponding secret is added."

      - name: Skipped publish (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          echo "::notice title=Dry run::Publish, pin update and release were skipped (dry_run=true)."

      - name: Update ghostty-upstream.json
        if: env.NUGET_API_KEY != '' && env.DRY_RUN != 'true' && needs.regenerate-bindings.result == 'success'
        run: |
          cat > ghostty-upstream.json << EOF
          {
            "repo": "https://github.com/ghostty-org/ghostty.git",
            "branch": "main",
            "commit": "${{ needs.check-upstream.outputs.new_commit }}",
            "upstreamVersion": "${{ needs.check-upstream.outputs.new_version }}",
            "lastUpdated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MESSAGE="chore: update upstream to ${{ needs.check-upstream.outputs.new_commit }}"
          if ! git diff --quiet -- build/bindings-reference/NativeMethods.pinned.cs; then
            git add build/bindings-reference/NativeMethods.pinned.cs
            git add src/Ghostty.Vt/Raw/GhosttyVtNative.g.cs
            MESSAGE="$MESSAGE and refresh pinned binding reference"
            echo "Including the regenerated pinned binding reference and compiled layer."
          else
            echo "The regenerated reference is unchanged; moving the pin only."
          fi

          git add ghostty-upstream.json
          git diff --cached --quiet || git commit -m "$MESSAGE"
          git push

      - name: Hold pin (binding reference unavailable)
        if: env.NUGET_API_KEY != '' && env.DRY_RUN != 'true' && needs.regenerate-bindings.result != 'success'
        run: |
          echo "::warning title=Binding reference::regenerate-bindings did not succeed; keeping the pin at the current commit so main stays consistent. The package was published; the next nightly retries the pin move."

      - name: Create GitHub Release
        if: env.NUGET_API_KEY != '' && env.DRY_RUN != 'true' && needs.regenerate-bindings.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.package_version }}" \
            --title "v${{ steps.version.outputs.package_version }}" \
            --notes "Automated daily build from upstream ghostty-org/ghostty@${{ needs.check-upstream.outputs.new_commit }}"

  # Failure reporting lives here, not inside `publish`.
  #
  # It used to be a `Create issue on failure` step inside `publish`, which
  # meant it could only ever report a *publish* failure. For 57 consecutive
  # nights `build-native` failed, `publish` was skipped, and that step never
  # ran — which is why the outage in #43 produced zero issues. This job's
  # `if: failure()` fires whenever any ancestor failed, `build-native`
  # included, so the alert now covers the failure mode that actually happened.
  #
  # It also reports one issue for the *condition*, not one per upstream SHA.
  # The old title embedded the commit, which changes daily, so once
  # `build-native` started passing it would have filed a brand-new issue every
  # single night with no dedupe. Search for the open tracker first and add a
  # dated comment; only create one when there is none. Closing the tracker is
  # how a maintainer says "handled" — if the condition recurs after that, a
  # fresh issue is the right outcome.
  notify-failure:
    # `regenerate-bindings` is listed because it now feeds publish and because
    # a broken generator must reach the tracker even though the package can
    # still publish; publish holds the pin when the reference is unavailable.
    # Leaving it out here would make a generator failure silent in the one
    # place anyone actually looks — precisely how #46 went unnoticed.
    #
    # Known consequence of that choice, deliberately accepted: if
    # `regenerate-bindings` fails while the package publishes, this files
    # "Daily upstream sync is failing" on a run that published to NuGet but
    # did not move the pin. The alert is correct that something needs
    # attention; read the run before acting.
    needs: [check-upstream, regenerate-bindings, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      # A dry run must not write to the public tracker, or the input is not
      # the non-mutating switch it advertises.
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Report sync failure
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately has no `actions/checkout` — it only talks to
          # the API — so `gh` has no git remote to infer the repo from and
          # would fail with "not a git repository". GH_REPO supplies it
          # without cloning. (The old step worked only because it happened to
          # sit inside `publish`, which checks out.)
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.check-upstream.outputs.new_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Daily upstream sync is failing
        run: |
          set -euo pipefail

          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "::notice::Commenting on existing sync-failure issue #$EXISTING"
            gh issue comment "$EXISTING" \
              --body "Still failing, now for upstream \`${COMMIT}\` — [run](${RUN_URL})."
          else
            echo "::notice::Opening a new sync-failure issue"
            gh issue create --title "$TITLE" --body \
          "The daily upstream sync failed for upstream \`${COMMIT}\` — [run](${RUN_URL}).

          The package may still have published; the pin is only moved when the generated binding reference is available.

          Further failures are added as comments here rather than as new issues.
          Close this once the sync is green again; if it breaks later, a fresh issue is opened."
          fi

      - name: Reporting skipped (dry run)
        if: env.DRY_RUN == 'true'
        run: echo "::notice title=Dry run::Sync failed, but issue reporting was skipped (dry_run=true)."
