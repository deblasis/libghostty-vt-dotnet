name: Setup ClangSharpPInvokeGenerator (Linux)
description: >
  Installs ClangSharpPInvokeGenerator together with the native libraries it
  needs on Linux. The dotnet-tool package ships ONLY Windows natives, so a
  plain `dotnet tool install` produces a generator that cannot start on a
  Linux runner (see issue #46). This action supplies the matching linux-x64
  `libclang.so` and `libClangSharp.so` and fails loudly if it cannot.

inputs:
  generator-version:
    description: >
      ClangSharpPInvokeGenerator version. 18.1.0.4 is the last release
      packaged for net8.0; 20.x and later target net10.0.
    required: false
    default: '18.1.0.4'
  libclang-version:
    description: libclang.runtime.linux-x64 version (must match the generator's clang major).
    required: false
    default: '18.1.3.2'
  libclangsharp-version:
    description: libclangsharp.runtime.linux-x64 version (must match the generator's clang major).
    required: false
    default: '18.1.3.1'

outputs:
  generator:
    description: Absolute path to the ClangSharpPInvokeGenerator executable.
    value: ${{ steps.install.outputs.generator }}
  extra-args-file:
    description: >
      A generated response file with the machine-specific clang arguments
      (currently -resource-dir). Pass it after build/generate-bindings.rsp so
      the checked-in rsp stays free of absolute paths.
    value: ${{ steps.install.outputs.extra_args_file }}

runs:
  using: composite
  steps:
    - name: Install generator and its Linux natives
      id: install
      shell: bash
      env:
        GEN_VERSION: ${{ inputs.generator-version }}
        LIBCLANG_VERSION: ${{ inputs.libclang-version }}
        LIBCLANGSHARP_VERSION: ${{ inputs.libclangsharp-version }}
      run: |
        set -euo pipefail

        for v in "$GEN_VERSION" "$LIBCLANG_VERSION" "$LIBCLANGSHARP_VERSION"; do
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'$v' is not a valid NuGet version"
            exit 1
          fi
        done

        TOOL_DIR="$RUNNER_TEMP/clangsharp"
        dotnet tool install --tool-path "$TOOL_DIR" --version "$GEN_VERSION" ClangSharpPInvokeGenerator

        # Why this action exists at all:
        #
        # The ClangSharpPInvokeGenerator nupkg carries `libclang.dll` and
        # `libClangSharp.dll` under tools/net8.0/any — Windows only. There is
        # no `.so` in it at any version. On Linux the generator therefore
        # throws DllNotFoundException from clang.getClangVersion() in the
        # PInvokeGenerator constructor, before it opens a single header.
        #
        # .NET probes for a DllImport library in the assembly's own directory
        # first; the original failure log named the exact path it wanted
        # (".../tools/net8.0/any/libclang.so"), so dropping the .so files
        # beside the managed assemblies is all that is required.
        ASM_DIR=$(dirname "$(find "$TOOL_DIR/.store" -name 'ClangSharpPInvokeGenerator.dll' -print -quit)")
        if [ -z "$ASM_DIR" ] || [ ! -d "$ASM_DIR" ]; then
          echo "::error::Could not locate the installed generator assemblies under $TOOL_DIR/.store"
          exit 1
        fi
        echo "Generator assemblies: $ASM_DIR"

        fetch_native() {
          id="$1"; ver="$2"
          tmp=$(mktemp -d)
          echo "Fetching $id $ver"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o "$tmp/pkg.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/${id}/${ver}/${id}.${ver}.nupkg"
          unzip -q -o "$tmp/pkg.nupkg" 'runtimes/linux-x64/native/*' -d "$tmp"
          if ! ls "$tmp"/runtimes/linux-x64/native/*.so >/dev/null 2>&1; then
            echo "::error::$id $ver contained no linux-x64 .so payload"
            exit 1
          fi
          cp "$tmp"/runtimes/linux-x64/native/*.so "$ASM_DIR/"
          rm -rf "$tmp"
        }

        fetch_native libclang.runtime.linux-x64 "$LIBCLANG_VERSION"
        fetch_native libclangsharp.runtime.linux-x64 "$LIBCLANGSHARP_VERSION"

        # libClangSharp.so has a DT_NEEDED on libclang by SONAME
        # ("libclang.so.18.1"), but the libclang.runtime package ships the
        # file unversioned as plain "libclang.so", so the dynamic loader
        # cannot resolve it. Add the SONAME as a symlink — derived from ldd's
        # own "not found" line rather than hardcoded, so a future clang ABI
        # bump does not silently re-break this.
        for missing in $(ldd "$ASM_DIR/libClangSharp.so" 2>/dev/null | awk '/not found/ {print $1}'); do
          case "$missing" in
            libclang.so.*)
              ln -sf libclang.so "$ASM_DIR/$missing"
              echo "  linked $missing -> libclang.so"
              ;;
            *)
              echo "::error::libClangSharp.so needs '$missing', which this action does not provide"
              exit 1
              ;;
          esac
        done

        # The assembly directory is not on the default loader search path, so
        # resolving that DT_NEEDED needs it explicitly — both for the ldd
        # assertions below and for the generator step that follows.
        export LD_LIBRARY_PATH="$ASM_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

        # Assert rather than hope. A missing or unloadable native here is the
        # difference between "the bindings did not drift" and "the detector
        # never ran" — the two outcomes #46 is about not confusing.
        for lib in libclang.so libClangSharp.so; do
          if [ ! -f "$ASM_DIR/$lib" ]; then
            echo "::error::$lib was not installed into $ASM_DIR"
            exit 1
          fi
          if ! ldd "$ASM_DIR/$lib" > /tmp/ldd.txt 2>&1; then
            echo "::error::$lib is present but not loadable"
            cat /tmp/ldd.txt
            exit 1
          fi
          if grep -q 'not found' /tmp/ldd.txt; then
            echo "::error::$lib has unresolved shared-library dependencies"
            grep 'not found' /tmp/ldd.txt
            exit 1
          fi
          printf '  %-20s %s bytes, all deps resolved\n' "$lib" "$(stat -c%s "$ASM_DIR/$lib")"
        done

        # libclang needs clang's own builtin headers (stddef.h, stdint.h,
        # limits.h, ...). The libclang.runtime package ships only the shared
        # library, so without them parsing dies on:
        #     /usr/include/limits.h:124:16: fatal error: 'limits.h' file not found
        # That line is an `#include_next`, which by definition resumes the
        # search *after* /usr/include — so an extra `-I` cannot satisfy it and
        # only `-resource-dir` will. The major version has to match libclang's.
        CLANG_MAJOR=${LIBCLANG_VERSION%%.*}
        find_resource_dir() {
          if command -v "clang-$CLANG_MAJOR" >/dev/null 2>&1; then
            "clang-$CLANG_MAJOR" -print-resource-dir 2>/dev/null && return 0
          fi
          for d in "/usr/lib/llvm-$CLANG_MAJOR/lib/clang/$CLANG_MAJOR" "/usr/lib/clang/$CLANG_MAJOR"; do
            if [ -d "$d/include" ]; then echo "$d"; return 0; fi
          done
          return 1
        }

        RESOURCE_DIR=$(find_resource_dir || true)
        if [ -z "$RESOURCE_DIR" ] || [ ! -f "$RESOURCE_DIR/include/limits.h" ]; then
          echo "Clang $CLANG_MAJOR builtin headers not present; installing libclang-common-$CLANG_MAJOR-dev"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "libclang-common-$CLANG_MAJOR-dev"
          RESOURCE_DIR=$(find_resource_dir || true)
        fi

        if [ -z "$RESOURCE_DIR" ] || [ ! -f "$RESOURCE_DIR/include/limits.h" ]; then
          echo "::error::Could not locate clang $CLANG_MAJOR builtin headers (need <resource-dir>/include/limits.h)"
          exit 1
        fi
        echo "  clang resource dir: $RESOURCE_DIR"

        EXTRA_ARGS="$TOOL_DIR/extra-args.rsp"
        printf -- '--additional\n-resource-dir=%s\n' "$RESOURCE_DIR" > "$EXTRA_ARGS"

        echo "generator=$TOOL_DIR/ClangSharpPInvokeGenerator" >> "$GITHUB_OUTPUT"
        echo "extra_args_file=$EXTRA_ARGS" >> "$GITHUB_OUTPUT"
